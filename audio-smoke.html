<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser audio smoke test</title>
  <body>
    <h1>Browser audio smoke test</h1>
    <p>Click the button to resume Web Audio and play a generated 440 Hz WAV through the audio backend.</p>
    <button id="play" type="button">Play test tone</button>
    <output id="status" aria-live="polite">Waiting for user action.</output>
    <script type="module">
      import { BrowserAudioBackend } from '/src/audio/backend.ts';

      function makeToneWav() {
        const sampleRate = 22050;
        const sampleCount = sampleRate / 2;
        const bytes = new ArrayBuffer(44 + sampleCount * 2);
        const view = new DataView(bytes);
        const text = (offset, value) => [...value].forEach((character, index) => view.setUint8(offset + index, character.charCodeAt(0)));
        text(0, 'RIFF'); view.setUint32(4, bytes.byteLength - 8, true); text(8, 'WAVE');
        text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
        view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true); text(36, 'data');
        view.setUint32(40, sampleCount * 2, true);
        for (let i = 0; i < sampleCount; i++) {
          const envelope = Math.min(1, i / 500, (sampleCount - i) / 1000);
          view.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 440 * i / sampleRate) * 9000 * envelope), true);
        }
        return new Blob([bytes], { type: 'audio/wav' });
      }

      const backend = new BrowserAudioBackend();
      const toneUrl = URL.createObjectURL(makeToneWav());
      const status = document.querySelector('#status');
      document.querySelector('#play').addEventListener('click', async () => {
        status.textContent = 'Starting…';
        try {
          await backend.resume();
          const playback = await backend.play(toneUrl);
          status.textContent = 'Playing. Playback completion will be reported below.';
          await playback.finished;
          status.textContent = 'PASS: playback finished.';
        } catch (error) {
          status.textContent = `FAIL: ${error.message}`;
        }
      });
      window.addEventListener('pagehide', () => {
        URL.revokeObjectURL(toneUrl);
        void backend.dispose();
      }, { once: true });
    </script>
  </body>
</html>
